# Contoh vhost nginx untuk API PantauPegawai, dipakai bila VPS sudah memakai
# nginx di port 80/443 (lihat docs/13-deploy-vps.md).
#
#   sudo cp deploy/nginx-api-pawai.conf /etc/nginx/sites-available/api-pawai
#   sudo ln -s /etc/nginx/sites-available/api-pawai /etc/nginx/sites-enabled/api-pawai
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api-pawai.toolkitbps.my.id --redirect
#
# Port 3102 harus sama dengan port di docker-compose.override.yml.
server {
    listen 80;
    server_name api-pawai.toolkitbps.my.id;

    # Upload foto dibatasi API 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
