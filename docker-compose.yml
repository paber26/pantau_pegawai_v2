# PantauPegawai — deploy di VPS.
# Panduan lengkap: docs/13-deploy-vps.md
#
#   cp .env.example .env   # lalu isi nilainya
#   docker compose up -d --build

name: pantau-pegawai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantau
      POSTGRES_USER: pantau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantau -d pantau"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sengaja TANPA "ports:". Database hanya bisa diakses dari container lain;
    # port yang dibuka Docker tidak ikut diblokir firewall UFW.
    logging: *logging

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pantau:${POSTGRES_PASSWORD}@db:5432/pantau
      PUBLIC_API_URL: https://${API_DOMAIN:?isi API_DOMAIN di .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?isi CORS_ORIGINS di .env}
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:?isi GOOGLE_DRIVE_ROOT_FOLDER_ID di .env}
      # Upload foto atas nama Gmail pemilik folder (opsional, lihat docs/13-deploy-vps.md).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      GOOGLE_SHEETS_API_KEY: ${GOOGLE_SHEETS_API_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      # Backup harian dari container `backup` disalin ke Drive (folder "Backup Database").
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:ro
    secrets:
      - google-service-account
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Menyimpan sertifikat HTTPS; jangan dihapus agar tidak terkena
      # batas permintaan sertifikat Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: pantau
      PGDATABASE: pantau
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    logging: *logging

secrets:
  # File JSON key service account Google (yang sama dengan yang dipakai
  # Edge Function Supabase sebelumnya). Lihat docs/13-deploy-vps.md.
  google-service-account:
    file: ./secrets/google-service-account.json

volumes:
  db-data:
  caddy-data:
  caddy-config:
